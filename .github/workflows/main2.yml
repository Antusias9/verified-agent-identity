name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Agent Name'
        required: true
        default: 'Antusias9'
      agent_description:
        description: 'Agent Description'
        required: true
        default: 'Antusias9 AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Install verified-agent-identity skill
        run: clawhub install verified-agent-identity --force

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge "{\"name\": \"Antusias9\", \"description\": \"Antusias9 AI Agent\"}"
